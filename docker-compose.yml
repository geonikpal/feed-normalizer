services:
  feed-normalizer:
    build: .
    container_name: feed-normalizer
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: feed-normalizer-tests
    depends_on:
      feed-normalizer:
        condition: service_healthy
    environment:
      - BASE_URL=http://feed-normalizer:8080